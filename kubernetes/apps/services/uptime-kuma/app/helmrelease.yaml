---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: services
spec:
  chartRef:
    kind: OCIRepository
    name: uptime-kuma
  interval: 1h
  values:
    controllers:
      uptime-kuma:
        containers:
          app:
            image:
              repository: louislam/uptime-kuma
              tag: 2.0.4
            env:
              TZ: "America/New_York"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: uptime-kuma
        ports:
          http:
            port: 3001
    route:
      app:
        hostnames:
          - "uptime.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 3001
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: nfs-media
        globalMounts:
          - path: /app/data
