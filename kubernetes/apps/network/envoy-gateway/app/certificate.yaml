---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "niyza-org-production"
spec:
  dnsNames:
    - "niyza.org"
    - "*.niyza.org"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
  secretName: "niyza-org-production-tls"
  usages:
    - digital signature
