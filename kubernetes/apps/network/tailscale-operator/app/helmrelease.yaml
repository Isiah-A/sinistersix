---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
  interval: 1h
  values:
    apiServerProxyConfig:
      mode: "true"
    proxyConfig:
      defaultProxyClass: userspace
    oauth:
      clientId: ""
      clientSecret: ""
      existingSecret:
        name: operator-oauth
