---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: profilarr
  interval: 1h
  values:
    controllers:
      profilarr:
        containers:
          app:
            image:
              repository: ghcr.io/dictionarry-hub/profilarr
              tag: latest
            env:
              TZ: "America/New_York"
              PUID: "568"
              PGID: "568"
              ORIGIN: "https://profilarr.${SECRET_DOMAIN}"
              PARSER_HOST: "localhost"
              PARSER_PORT: "5000"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          parser:
            image:
              repository: ghcr.io/dictionarry-hub/profilarr-parser
              tag: latest
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: profilarr
        ports:
          http:
            port: 6868
    route:
      app:
        hostnames:
          - "profilarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 6868
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: nfs-media
        advancedMounts:
          profilarr:
            app:
              - path: /config
EOF