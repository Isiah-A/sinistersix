---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: navidrome
  interval: 1h
  values:
    controllers:
      navidrome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/navidrome/navidrome
              tag: latest
            env:
              TZ: "America/New_York"
              ND_MUSICFOLDER: /music
              ND_DATAFOLDER: /data
              ND_SCANSCHEDULE: "1h"
              ND_LOGLEVEL: info
              ND_SESSIONTIMEOUT: 24h
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: navidrome
        ports:
          http:
            port: 4533
    route:
      app:
        hostnames:
          - "navi.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 4533
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: longhorn
        globalMounts:
          - path: /data
      music:
        type: persistentVolumeClaim
        existingClaim: media-library
        globalMounts:
          - path: /music
            subPath: music
        readOnly: true
