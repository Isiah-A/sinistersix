---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opengym
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: opengym
  interval: 1h
  values:
    controllers:
      opengym:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          media-fetch:
            image:
              repository: docker.io/alpine/git
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                mkdir -p /media/img /media/gif
                if [ -z "$(ls -A /media/img 2>/dev/null)" ]; then
                  echo "Downloading exercise media (~140MB, one time)..."
                  git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
                  cp /tmp/ds/images/*.jpg /media/img/
                  cp /tmp/ds/videos/*.gif /media/gif/
                  echo "Done."
                else
                  echo "Exercise media already present, skipping."
                fi
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        containers:
          api:
            image:
              repository: ghcr.io/duartesantos8/opengym-api
              tag: latest
            env:
              PORT: "3000"
              DATA_DIR: /data
              TZ: "America/New_York"
              RP_ID: "gym.niyza.org"
              ORIGIN: "https://gym.niyza.org"
              RP_NAME: "openGym"
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          web:
            image:
              repository: ghcr.io/duartesantos8/opengym-web
              tag: latest
            env:
              NGINX_PORT: "80"
              BACKEND: "127.0.0.1"
              PORT: "3000"
              RESOLVER: "10.43.0.10"
              CF_CONNECTING_IP: ""
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: opengym
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - "gym.niyza.org"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 80
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: longhorn
        advancedMounts:
          opengym:
            api:
              - path: /data
      coach-auth:
        type: emptyDir
        advancedMounts:
          opengym:
            api:
              - path: /coach-auth
      exercise-media:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: longhorn
        advancedMounts:
          opengym:
            media-fetch:
              - path: /media
            web:
              - path: /usr/share/nginx/html/img
                subPath: img
                readOnly: true
              - path: /usr/share/nginx/html/gif
                subPath: gif
                readOnly: true
