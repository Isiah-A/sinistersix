---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: firefly-importer
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: firefly-importer
  interval: 1h
  values:
    controllers:
      firefly-importer:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/fireflyiii/data-importer
              tag: version-1.7.4
            env:
              TZ: "America/New_York"
              FIREFLY_III_URL: "http://firefly.media.svc.cluster.local:8080"
              VANITY_URL: "https://firefly.${SECRET_DOMAIN}"
              TRUSTED_PROXIES: "**"
            envFrom:
              - secretRef:
                  name: firefly-importer-secret
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: firefly-importer
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - "import.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
