---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/apps/monitoring/alloy/app
  prune: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: monitoring
  wait: true
  dependsOn:
    - name: loki
      namespace: flux-system
